services:
  - type: web
    name: nerio-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ALLOWED_ORIGINS
        value: https://marcelo5u4r3z.github.io
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 20
